<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macro Concepts · 全英记忆器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f2ea; --bg-soft:#f0eaf0;
  --card:#fffdf8; --card-2:#faf6ee;
  --ink:#3d3833; --ink-2:#5f584f; --muted:#8f877c;
  --line:#e8e0d3; --line-2:#f1eade;
  --accent:#4d7c6a; --accent-2:#3a6b58;
  --accent-soft:#e5efea; --accent-text:#3c6b57;
  --warm:#b08968; --star:#d4a373;
  --ok:#4a8a6a; --ok-soft:#e9f3ed; --ok-line:#c2dccb;
  --danger:#b85c5c;
  --shadow:0 1px 2px rgba(90,75,55,.05),0 2px 8px rgba(90,75,55,.045);
  --shadow-lg:0 16px 44px rgba(90,75,55,.13);
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#1a1816; --bg-soft:#211e1b;
  --card:#262320; --card-2:#2b2825;
  --ink:#e6e0d6; --ink-2:#c3bbb0; --muted:#8e867b;
  --line:#38332e; --line-2:#2e2a26;
  --accent:#7fb8a3; --accent-2:#9ecfb8;
  --accent-soft:rgba(127,184,163,.14); --accent-text:#8fc9b3;
  --warm:#c9a483; --star:#e0b584;
  --ok:#7fb894; --ok-soft:rgba(127,184,148,.13); --ok-line:rgba(127,184,148,.3);
  --danger:#d98b8b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 16px 44px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.75;font-size:15px;
  transition:background .3s,color .3s;
  padding-bottom:70px;
}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:11px 18px;display:flex;align-items:center;gap:12px;
}
.brand{font-weight:800;font-size:14.5px;letter-spacing:-.1px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand::before{content:"";width:10px;height:10px;border-radius:3.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.4px}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{width:88px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .45s cubic-bezier(.3,1,.4,1)}
.tbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  height:34px;padding:0 12px;border-radius:10px;font-family:inherit;
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent-text)}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tbtn.has-voice::after{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:2px;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 22%,transparent);
}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;cursor:pointer;font-family:inherit;transition:.16s;padding:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-text)}
@media(max-width:700px){
  .brand small{display:none}
  .prog-bar{width:46px}
  .topbar{padding:9px 12px;gap:8px}
  .tbtn{padding:0 9px;font-size:11.5px}
}

/* ============ 语音设置面板 ============ */
.voice-panel{
  position:fixed;top:64px;right:18px;z-index:120;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;box-shadow:var(--shadow-lg);
  display:none;min-width:290px;max-width:min(360px,92vw);
}
.voice-panel.open{display:block;animation:popIn .22s cubic-bezier(.2,.9,.3,1.15)}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vp-title{
  font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:12px;display:flex;align-items:center;gap:7px;
}
.vp-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.vp-row{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.vp-row:last-child{margin-bottom:0}
.vp-label{
  font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;min-width:52px;flex:none;
}
.vp-select{
  flex:1;font-family:inherit;font-size:12.5px;font-weight:600;
  padding:8px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;outline:none;
  min-width:0;max-width:100%;
  transition:.16s;
}
.vp-select:hover{border-color:var(--accent)}
.vp-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vp-hint{
  font-size:11px;color:var(--muted);font-weight:600;line-height:1.55;
  background:var(--card-2);border-radius:8px;padding:8px 11px;margin-top:11px;
  display:flex;gap:7px;align-items:flex-start;
}
.vp-hint .ic{flex:none;font-size:12px;line-height:1.55;opacity:.75}
.vp-btn{
  width:100%;font-family:inherit;font-size:12px;font-weight:700;
  padding:9px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);cursor:pointer;transition:.16s;
}
.vp-btn:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.vp-btn.playing{background:var(--danger);border-color:var(--danger);color:#fffdf8}
.vp-btn.playing:hover{filter:brightness(.94);color:#fffdf8;background:var(--danger)}

/* ============ 工具栏 ============ */
.toolbar{max-width:1040px;margin:0 auto;padding:18px 16px 0;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:5px;background:var(--card-2);border:1px solid var(--line);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:1;min-width:80px;border:0;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:700;padding:9px 10px;border-radius:9px;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.tabs button:hover{color:var(--accent-text);background:var(--accent-soft)}
.tabs button.active{background:var(--accent);color:#fffdf8;box-shadow:0 3px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
html[data-theme="dark"] .tabs button.active{color:#1a1816}

.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:190px;position:relative}
.search input{
  width:100%;font-family:inherit;font-size:13.5px;font-weight:600;
  padding:10px 14px 10px 37px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;transition:.16s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::placeholder{color:var(--muted);font-weight:500}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;
  border-radius:99px;cursor:pointer;transition:.16s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-text)}
.chip .n{opacity:.6;font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}

/* ============ 主区 ============ */
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px}

.ghead{
  display:flex;align-items:center;gap:10px;margin:28px 0 13px;
  font-size:11.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
}
.ghead:first-child{margin-top:8px}
.ghead .bar{width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.ghead .cnt{background:var(--accent-soft);color:var(--accent-text);padding:2px 8px;border-radius:99px;font-size:10.5px;letter-spacing:0}

/* ---- 浏览卡 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.bc{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px 16px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;
}
.bc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:0;transition:.18s}
.bc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 32%,var(--line));box-shadow:0 10px 28px rgba(90,75,55,.11)}
.bc:hover::before{opacity:1}
.bc.done{background:var(--ok-soft);border-color:var(--ok-line)}
.bc.done::before{opacity:1;background:linear-gradient(180deg,var(--ok),#6bb08c)}
.bc-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.bc-num{
  flex:none;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--accent-soft);color:var(--accent-text);padding:3px 8px;border-radius:6px;letter-spacing:.5px;
  margin-top:2px;
}
.bc.done .bc-num{background:color-mix(in srgb,var(--ok) 17%,transparent);color:var(--ok)}
.bc-names{flex:1;min-width:0}
.bc-en{font-size:15px;font-weight:750;line-height:1.4;letter-spacing:-.1px;color:var(--ink)}
.bc-cn{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.bc-def{
  font-size:13px;line-height:1.72;color:var(--ink-2);font-weight:500;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:11px;
}
.bc-def .kw{color:var(--accent-text);font-weight:700}
.bc-fml{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  font-size:11px;color:var(--muted);background:var(--card-2);
  padding:6px 9px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:10px;
}
.bc-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line-2)}
.bc-hint{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.bc-edited{
  font-size:10px;font-weight:800;color:var(--star);
  background:color-mix(in srgb,var(--star) 15%,transparent);
  padding:2px 7px;border-radius:99px;letter-spacing:.3px;line-height:1.4;
}
.spacer{flex:1}
.star{font-size:13px;opacity:.22;cursor:pointer;transition:.16s;padding:2px;line-height:1}
.star:hover{opacity:.75;transform:scale(1.18)}
.star.on{opacity:1;color:var(--star)}
.tick{
  flex:none;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:transparent;transition:.16s;cursor:pointer;background:var(--card);
  font-family:inherit;padding:0;
}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.bc.done .tick{background:var(--ok);border-color:var(--ok);color:#fffdf8}

/* ---- 背诵卡 ---- */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc{width:100%;max-width:660px;perspective:2000px;cursor:pointer;user-select:none}
.fc-in{display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.12,.2,1)}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{
  grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:34px 32px;box-shadow:var(--shadow-lg);min-height:400px;
  display:flex;flex-direction:column;
}
.fc-back{transform:rotateY(180deg);overflow-y:auto;max-height:76vh}
.fc-front{align-items:center;justify-content:center;text-align:center;gap:18px}
.fc-badge{
  font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--accent-text);background:var(--accent-soft);padding:5px 14px;border-radius:99px;
}
.fc-en{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.28;color:var(--ink)}
.fc-cn{font-size:14px;color:var(--muted);font-weight:600}
.fc-prompt{
  font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px;
  margin-top:8px;opacity:.85;
}
.fc-prompt::before{content:"— "}
.fc-prompt::after{content:" —"}
.fc-sec{margin-bottom:17px}
.fc-sec:last-of-type{margin-bottom:0}
.fc-label{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:7px;display:flex;align-items:center;gap:6px;
}
.fc-label::after{content:"";flex:1;height:1px;background:var(--line-2)}
.fc-def{
  font-size:14.5px;line-height:1.85;color:var(--ink);font-weight:500;
  font-family:Georgia,"Times New Roman","Songti SC",serif;
}
.fc-def .kw{
  color:var(--accent-text);font-weight:700;
  background:linear-gradient(180deg,transparent 64%,var(--accent-soft) 64%);
  padding:0 2px;border-radius:2px;
}
.fc-cn-def{font-size:13px;line-height:1.8;color:var(--ink-2)}
.fc-tipbox{
  background:color-mix(in srgb,var(--star) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--star) 26%,transparent);
  border-radius:11px;padding:12px 15px;font-size:13.5px;font-weight:650;
  color:var(--ink);line-height:1.72;
}
.fc-fml{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  background:var(--accent-soft);color:var(--accent-text);
  padding:12px 16px;border-radius:11px;word-break:break-word;line-height:1.65;
}
.fc-ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:660px}
.counter{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:660px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s;cursor:pointer}
.dots i.done{background:var(--ok)}
.dots i.cur{background:var(--accent);transform:scale(1.55)}

/* ---- 按钮 ---- */
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:11px;
  cursor:pointer;transition:.16s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
}
.btn:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line);color:var(--ink-2);background:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fffdf8;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{filter:brightness(.94);color:#fffdf8;background:var(--accent)}
html[data-theme="dark"] .btn.primary{color:#1a1816}
html[data-theme="dark"] .btn.primary:hover{color:#1a1816}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fffdf8}
.btn.ok:hover{filter:brightness(.94);color:#fffdf8;background:var(--ok)}
html[data-theme="dark"] .btn.ok{color:#1a1816}
html[data-theme="dark"] .btn.ok:hover{color:#1a1816}
.btn.warn{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}
.btn.warn:hover{background:color-mix(in srgb,var(--danger) 9%,transparent);border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.speak.playing{background:var(--danger);border-color:var(--danger);color:#fffdf8}
.btn.speak.playing:hover{background:var(--danger);filter:brightness(.94);color:#fffdf8;border-color:var(--danger)}

/* ---- 挖空 ---- */
.cloze-wrap{max-width:700px;margin:0 auto}
.cloze-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:30px 32px;box-shadow:var(--shadow-lg);
}
.cloze-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.cloze-num{
  font-size:10.5px;font-weight:800;letter-spacing:.6px;
  background:var(--accent-soft);color:var(--accent-text);padding:3px 9px;border-radius:6px;
}
.cloze-en{font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.cloze-cn{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:18px}

.cloze-density{
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;padding:11px 15px;border-radius:12px;
  background:var(--card-2);border:1px solid var(--line-2);
}
.density-label{
  font-size:10.5px;font-weight:800;color:var(--muted);
  letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;flex:none;
}
.density-range{
  flex:1;accent-color:var(--accent);height:5px;cursor:pointer;min-width:80px;
}
.density-value{
  font-size:13.5px;font-weight:800;color:var(--accent-text);
  font-variant-numeric:tabular-nums;min-width:46px;text-align:right;flex:none;
}
.density-info{
  font-size:11px;color:var(--muted);font-weight:600;
  min-width:58px;text-align:right;flex:none;font-variant-numeric:tabular-nums;
}

.cloze-body{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:16px;line-height:2.15;color:var(--ink);font-weight:500;
}
.cloze-body .kw{
  color:var(--accent-text);font-weight:700;
  background:linear-gradient(180deg,transparent 64%,var(--accent-soft) 64%);
  padding:0 2px;border-radius:2px;
}
.blank{
  display:inline-block;min-width:2.5em;
  border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 55%,transparent);
  margin:0 3px;padding:0 5px 1px;cursor:pointer;
  color:transparent;transition:.22s;border-radius:4px 4px 0 0;
  text-align:center;vertical-align:baseline;
}
.blank:hover{background:var(--accent-soft)}
.blank.on{
  color:var(--accent-text);font-weight:700;
  border-bottom-color:transparent;background:var(--accent-soft);
}
.cloze-bar{display:flex;gap:9px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line-2);flex-wrap:wrap;align-items:center}
.cloze-stat{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}

/* ---- 默写 ---- */
.write-wrap{max-width:720px;margin:0 auto}
.write-top{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.write-score{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.write-qcard{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:28px 30px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;
  position:relative;
}
.write-qcard::before{
  content:"WRITE THE DEFINITION";
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted);opacity:.75;
}
.write-term{
  font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--ink);
  margin:20px 0 6px;line-height:1.28;
}
.write-cn{font-size:13px;color:var(--muted);font-weight:600}
.write-hintline{
  font-size:11px;color:var(--muted);font-weight:600;margin-top:12px;letter-spacing:.3px;opacity:.85;

   ========================================================= */
const GROUPS = { A:'GDP 核算与物价', B:'生产函数与经济增长', C:'跨期选择与消费', D:'市场均衡与短期波动' };

const BASE_CONCEPTS = [
{ id:1, g:'A', cn:'实际GDP vs. 名义GDP', en:'Real vs. Nominal GDP',
  enDef:'**Nominal GDP** is the market value of all final goods and services produced in an economy in a given period, valued at **current prices**. **Real GDP** is the same measure but valued at **constant base-year prices**, adjusting for **inflation** to reflect true output.',
  cnDef:'名义GDP是按当前价格计算的产出总值；实际GDP是按基期不变价格计算，剔除了物价变动影响后的产出。',
  tip:'名义看钱（票面价值），实际看货（真实产量）。',
  fml:'Real GDP = (Nominal GDP / GDP Deflator) × 100' },

{ id:2, g:'A', cn:'生产法、收入法、支出法', en:'Production, Income, Expenditure Approach',
  enDef:'Three **equivalent methods** to measure GDP. The **production approach** sums **value added**; the **income approach** sums all incomes earned (wages, rents, profits); the **expenditure approach** sums total spending on final goods and services.',
  cnDef:'核算GDP的三种等价方法：生产法（各部门增加值）、收入法（要素报酬）、支出法（最终产品总支出）。',

function tokens(def){
  const out = [];
  const re = /\*\*(.+?)\*\*/g;
  let last = 0, m;
  while((m = re.exec(def)) !== null){
    if(m.index > last) out.push({t:'x', v:def.slice(last, m.index)});
    out.push({t:'k', v:m[1]});
    last = m.index + m[0].length;
  }
  if(last < def.length) out.push({t:'x', v:def.slice(last)});
  return out;
}
function renderHi(def){
  return tokens(def).map(p =>
    p.t === 'k' ? `<span class="kw">${esc(p.v)}</span>` : esc(p.v)
  ).join('');
}
function plainEn(def){
  return def.replace(/\*\*(.+?)\*\*/g, '$1');
}
function extractKeywords(def){
  const out = [];
  const re = /\*\*(.+?)\*\*/g;
  let m;
  while((m = re.exec(def)) !== null) out.push(m[1]);
  return out;
}
function tieHash(n){
  const v = (n * 2654435761 + 7919) % 1000003;
  return v < 0 ? v + 1000003 : v;
}
function selectMaskedKeywords(kwTokens, density){
  if(!kwTokens.length || density <= 0) return new Set();
  const count = kwTokens.length;
  let need = Math.round(count * density / 100);
  if(need <= 0) need = 1;
  if(need >= count) return new Set(kwTokens.map(t => t.idx));

  const sorted = kwTokens.slice().sort((a, b) => {
    const la = a.text.replace(/\s+/g, '').length;
    const lb = b.text.replace(/\s+/g, '').length;
    if(lb !== la) return lb - la;
    return tieHash(a.idx) - tieHash(b.idx);
  });

  const set = new Set();
  for(let i = 0; i < need; i++) set.add(sorted[i].idx);
  return set;
}

/* =========================================================
   答案对照引擎
   ========================================================= */
function normalize(s){
  return String(s || '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function stemMatch(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  const shorter = Math.min(a.length, b.length);
  if(shorter < 4) return false;
  let n = 0;
  while(n < shorter && a[n] === b[n]) n++;
  return n >= 4 && n >= shorter * 0.6;
}
function userHasWord(userWords, target){
  const t = target.toLowerCase();
  if(userWords.has(t)) return true;
  for(const w of userWords){
    if(stemMatch(w, t)) return true;
  }
  return false;
}
function checkAnswer(userText, keywords){
  const userWords = new Set(normalize(userText).split(' ').filter(Boolean));
  return keywords.map(kw => {
    const kwWords = normalize(kw).split(' ').filter(Boolean);
    const hit = kwWords.length > 0 && kwWords.every(w => userHasWord(userWords, w));
    return { keyword: kw, hit };
  });
}

/* =========================================================
   语音引擎
   ========================================================= */
const Speech = (() => {
  const ok = typeof window !== 'undefined' && 'speechSynthesis' in window;
  const LS_VOICE = 'macro-voice-v1';

  let allVoices = [];
  let ready = false;
  let readyCbs = [];
  let prefs = { voiceName: null, rate: 0.85 };
  let speaking = false;
  let speakCbs = [];

  function loadPrefs(){
    try{
      const raw = localStorage.getItem(LS_VOICE);
      if(!raw) return;
      const o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        if(typeof o.voiceName === 'string') prefs.voiceName = o.voiceName;
        if(typeof o.rate === 'number' && o.rate >= 0.4 && o.rate <= 2) prefs.rate = o.rate;
      }
    }catch(_){}
  }
  function savePrefs(){
    try{ localStorage.setItem(LS_VOICE, JSON.stringify(prefs)); }catch(_){}
  }
  loadPrefs();

  function normTag(t){ return String(t || '').toLowerCase().replace(/_/g, '-'); }

  function loadVoices(){
    if(!ok) return false;
    try{
      const vs = window.speechSynthesis.getVoices();
      if(vs && vs.length){
        allVoices = vs;
        if(!ready){
          ready = true;
          const cbs = readyCbs; readyCbs = [];
          cbs.forEach(cb => { try{ cb(); }catch(_){} });
        }
        return true;
      }
    }catch(_){}
    return false;
  }

  if(ok){
    loadVoices();
    let n = 0;
    const t = setInterval(() => {
      if(ready || n++ > 50){ clearInterval(t); return; }
      loadVoices();
    }, 150);
    try{
      window.speechSynthesis.onvoiceschanged = () => {
        loadVoices();
        if(ready) clearInterval(t);
      };
    }catch(_){}
  }

  function getEnglishVoices(){
    if(!allVoices.length) loadVoices();
    return allVoices.filter(v => /^en\b/i.test(normTag(v.lang)) || /^en-/i.test(normTag(v.lang)));
  }

  function pickVoice(){
    if(!allVoices.length) loadVoices();
    if(prefs.voiceName){
      const v = allVoices.find(x => x.name === prefs.voiceName);
      if(v) return v;
    }
    return allVoices.find(v => /en[-_]US/i.test(v.lang)) ||
           allVoices.find(v => /en[-_]GB/i.test(v.lang)) ||
           allVoices.find(v => /^en/i.test(v.lang)) || null;
  }

  function setVoiceByName(name){ prefs.voiceName = name || null; savePrefs(); }
  function getVoiceName(){ return prefs.voiceName; }
  function getVoice(){
    const v = pickVoice();
    return v ? { name: v.name, lang: v.lang } : null;
  }
  function setRate(r){ prefs.rate = r; savePrefs(); }
  function getRate(){ return prefs.rate; }

  function isReady(){ return ready; }
  function onReady(cb){
    if(ready){ try{ cb(); }catch(_){} }
    else readyCbs.push(cb);
  }

  function notifySpeak(state){
    speaking = state;
    const cbs = speakCbs.slice();
    cbs.forEach(cb => { try{ cb(state); }catch(_){} });
  }
  function onSpeakChange(cb){
    speakCbs.push(cb);
    try{ cb(speaking); }catch(_){}
  }
  function isSpeaking(){ return speaking; }

  function cancel(){
    if(!ok) return;
    try{
      if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
        window.speechSynthesis.cancel();
      }
    }catch(_){}
    notifySpeak(false);
  }

  function say(text){
    if(!ok){ toast('浏览器不支持语音合成'); return; }
    if(!text) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; }
      else { u.lang = 'en-US'; }
      u.rate = prefs.rate; u.pitch = 1; u.volume = 1;

      u.onstart = () => notifySpeak(true);
      u.onend = () => notifySpeak(false);
      u.onerror = () => notifySpeak(false);

      try{ window.speechSynthesis.resume(); }catch(_){}
      window.speechSynthesis.speak(u);
      setTimeout(() => { if(!speaking) notifySpeak(true); }, 80);
    }catch(_){ toast('朗读失败'); notifySpeak(false); }
  }

  return {
    ok, say, cancel,
    getEnglishVoices, setVoiceByName, getVoiceName, getVoice,
    setRate, getRate, isReady, onReady,
    isSpeaking, onSpeakChange
  };
})();

const voicePanel = document.getElementById('voicePanel');
const voiceBtn = document.getElementById('voiceBtn');
const voiceSelect = document.getElementById('voiceSelect');
const rateSelect = document.getElementById('rateSelect');
const vpTest = document.getElementById('vpTest');

function populateVoiceSelect(){
  if(!Speech.ok){
    voiceSelect.innerHTML = '<option>浏览器不支持</option>';
    voiceSelect.disabled = true;
    return;
  }
  const voices = Speech.getEnglishVoices();
  if(!voices.length){
    voiceSelect.innerHTML = '<option>未检测到英语语音</option>';
    voiceSelect.disabled = true;
    return;
  }
  voiceSelect.disabled = false;
  const sorted = voices.slice().sort((a, b) => {
    const la = String(a.lang).toLowerCase();
    const lb = String(b.lang).toLowerCase();
    if(la !== lb) return la < lb ? -1 : 1;
    return String(a.name).localeCompare(String(b.name));
  });
  const current = Speech.getVoiceName();
  voiceSelect.innerHTML =
    `<option value="">自动选择（推荐）</option>` +
    sorted.map(v =>
      `<option value="${esc(v.name)}"${v.name === current ? ' selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`
    ).join('');
  if(current && !sorted.some(v => v.name === current)){
    Speech.setVoiceByName(null);
    voiceSelect.value = '';
  }
  voiceBtn.classList.toggle('has-voice', !!Speech.getVoiceName());
}
function updateRateSelect(){
  rateSelect.value = String(Speech.getRate());
}
function refreshVoiceUI(){
  populateVoiceSelect();
  updateRateSelect();
  const v = Speech.getVoice();
  if(vpTest) vpTest.title = v ? v.name + ' (' + v.lang + ')' : '默认英语语音';
}
voiceBtn.onclick = e => {
  e.stopPropagation();
  voicePanel.classList.toggle('open');
  if(voicePanel.classList.contains('open')) refreshVoiceUI();
};
voiceSelect.onchange = () => {
  Speech.cancel();
  Speech.setVoiceByName(voiceSelect.value || null);
  voiceBtn.classList.toggle('has-voice', !!Speech.getVoiceName());
  toast(voiceSelect.value ? '已切换语音引擎' : '已切换为自动选择');
};
rateSelect.onchange = () => {
  Speech.cancel();
  Speech.setRate(+rateSelect.value);
  toast('语速：' + rateSelect.value + 'x');
};
vpTest.onclick = () => {
  if(Speech.isSpeaking()){ Speech.cancel(); return; }
  Speech.say('This is a test of the current text to speech voice. Real GDP is the same measure but valued at constant base-year prices.');
};
Speech.onSpeakChange(s => {
  if(vpTest){
    vpTest.classList.toggle('playing', s);
    vpTest.textContent = s ? '⏹ 停止朗读' : '🔊 试听当前语音';

function pool(){
  let l = CONCEPTS.slice();
  if(state.group !== 'all') l = l.filter(c => c.g === state.group);
  if(state.filter === 'todo') l = l.filter(c => !state.mastered.has(c.id));
  else if(state.filter === 'done') l = l.filter(c => state.mastered.has(c.id));
  else if(state.filter === 'star') l = l.filter(c => state.starred.has(c.id));
  // 搜索框仅在浏览模式渲染，故查询也只在浏览模式生效，避免跨模式静默过滤
  if(state.mode === 'browse'){
    const q = state.query.trim().toLowerCase();
    if(q) l = l.filter(c =>
      (c.cn+' '+c.en+' '+plainEn(c.enDef)+' '+c.cnDef+' '+c.tip+' '+c.fml).toLowerCase().includes(q)
    );
  }
  return l;
}

  row.style.display = '';

  const needSearch = (state.mode === 'browse');
  const needFilter = (state.mode === 'browse' || state.mode === 'recall' || state.mode === 'cloze' || state.mode === 'write');
  const needGroup  = true;   // 所有模式都显示分组条，确保 pool() 的过滤对用户可见

  const cnt = {};
  CONCEPTS.forEach(c => cnt[c.g] = (cnt[c.g]||0)+1);
  const TOTAL = CONCEPTS.length;

  let h = '';
  if(needSearch){
    h += `<div class="search"><input id="q" type="search" placeholder="Search concepts, formulas…" value="${esc(state.query)}"></div>`;
  }
  if(needGroup){
    h += `<div class="chips" id="gchips">
      <button class="chip ${state.group==='all'?'active':''}" data-g="all">全部<span class="n">${TOTAL}</span></button>
      ${Object.keys(GROUPS).map(g =>
        `<button class="chip ${state.group===g?'active':''}" data-g="${g}">${esc(GROUPS[g])}<span class="n">${cnt[g]||0}</span></button>`
      ).join('')}
    </div>`;
  }
  if(needFilter){
    const nm = state.mastered.size;
    h += `<div class="chips" id="fchips">
      <button class="chip ${state.filter==='all'?'active':''}" data-f="all">全部</button>
      <button class="chip ${state.filter==='todo'?'active':''}" data-f="todo">未掌握<span class="n">${TOTAL-nm}</span></button>
      <button class="chip ${state.filter==='done'?'active':''}" data-f="done">已掌握<span class="n">${nm}</span></button>
      <button class="chip ${state.filter==='star'?'active':''}" data-f="star">★<span class="n">${state.starred.size}</span></button>
    </div>`;
  }
  if(state.mode === 'recall' || state.mode === 'cloze' || state.mode === 'write'){
    h += `<button class="btn ghost" id="shuffleBtn" style="font-size:12px;padding:7px 13px">🔀 打乱</button>`;
  }
  if(state.mode === 'write'){
    h += `<button class="btn ghost" id="resetW" style="font-size:12px;padding:7px 13px">↺ 清空统计</button>`;
  }
  if(state.mode === 'browse' && hasAnyOverride()){
    h += `<button class="btn ghost" id="resetAllEdit" style="font-size:12px;padding:7px 13px">↺ 重置所有编辑</button>`;
  }
  row.innerHTML = h;

  const qi = document.getElementById('q');
  if(qi) qi.oninput = () => { state.query = qi.value; renderBrowse(); };

  const gc = document.getElementById('gchips');
  if(gc) gc.onclick = e => {
    const b = e.target.closest('[data-g]'); if(!b) return;
    state.group = b.dataset.g;
    resetSessionOrders();
    render();
  };
  const fc = document.getElementById('fchips');
  if(fc) fc.onclick = e => {
    const b = e.target.closest('[data-f]'); if(!b) return;
    state.filter = b.dataset.f;
    resetSessionOrders();
    render();
  };
  const sb = document.getElementById('shuffleBtn');
  if(sb) sb.onclick = () => {
    const ids = pool().map(c => c.id);
    for(let i = ids.length-1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [ids[i],ids[j]] = [ids[j],ids[i]];
    }
    if(state.mode === 'recall'){ state.rcOrder = ids; state.rcIdx = 0; state.rcFlipped = false; }
    else if(state.mode === 'cloze'){ state.clOrder = ids; state.clIdx = 0; state.clRevealed = new Set(); }
    else { state.wcOrder = ids; state.wcIdx = 0; state.write = null; }
    render();
    toast('已打乱顺序');
  };
  const rw = document.getElementById('resetW');
  if(rw) rw.onclick = () => {
    state.writeStats = { hits:0, keywords:0, count:0 };
    saveState(); render();
    toast('统计已清空');
  };
  const rae = document.getElementById('resetAllEdit');
  if(rae) rae.onclick = () => {
    if(!confirm('确定要恢复所有概念的默认内容吗？此操作不可撤销。')) return;
    resetAllConcepts();
    render();
    toast('已恢复全部默认内容');
  };
}
function resetSessionOrders(){
  state.rcIdx = 0; state.clIdx = 0; state.wcIdx = 0;
  state.rcFlipped = false;
  state.rcOrder = []; state.clOrder = []; state.wcOrder = [];
  state.clRevealed = new Set();
  state.write = null;
}

/* =========================================================
   主渲染
   ========================================================= */
const view = document.getElementById('view');

function render(){
  updateProg();
  renderTool();
  if(state.mode === 'browse') renderBrowse();
  else if(state.mode === 'recall') renderRecall();
  else if(state.mode === 'cloze') renderCloze();
  else if(state.mode === 'write') renderWrite();
  else if(state.mode === 'plan') renderPlan();
  else if(state.mode === 'pdf') renderPdf();
}

/* =========================================================
   模式一：浏览
   ========================================================= */
function renderBrowse(){
  const list = pool();
  if(!list.length){
    view.innerHTML = `<div class="empty"><div class="big">🔍</div>
      <h3>没有匹配的概念</h3><p>试试换个关键词，或清空筛选条件。</p></div>`;
    return;
  }
  const order = ['A','B','C','D'];
  let h = '';
  order.forEach(g => {
    const items = list.filter(c => c.g === g);
    if(!items.length) return;
    h += `<div class="ghead"><span class="bar"></span>${esc(GROUPS[g]||g)}<span class="cnt">${items.length}</span></div>`;
    h += `<div class="grid">${items.map(browseCard).join('')}</div>`;
  });
  view.innerHTML = h;
  view.querySelectorAll('.bc').forEach(el => {
    el.onclick = e => {
      const st = e.target.closest('[data-star]');
      if(st){ e.stopPropagation(); toggleStar(+st.dataset.star); return; }
      const tk = e.target.closest('[data-tick]');
      if(tk){ e.stopPropagation(); toggleMastered(+tk.dataset.tick); return; }
      openModal(+el.dataset.id);
    };
  });
}

function browseCard(c){
  const done = state.mastered.has(c.id);
  const star = state.starred.has(c.id);
  return `
    <div class="bc ${done?'done':''}" data-id="${c.id}">
      <div class="bc-top">
        <span class="bc-num">${String(c.id).padStart(2,'0')}</span>
        <div class="bc-names">
          <div class="bc-en">${esc(c.en)}</div>
          ${state.showCN ? `<div class="bc-cn">${esc(c.cn)}</div>` : ''}
        </div>
      </div>
      <div class="bc-def">${renderHi(c.enDef)}</div>
      <div class="bc-fml">${esc(c.fml)}</div>
      <div class="bc-foot">
        <span class="bc-hint">${done ? '✓ MASTERED' : 'TAP TO OPEN'}</span>
        ${isEdited(c.id) ? '<span class="bc-edited" title="已自定义">✎</span>' : ''}
        <span class="spacer"></span>
        <span class="star ${star?'on':''}" data-star="${c.id}" title="收藏">★</span>
        <button class="tick" data-tick="${c.id}" title="${done?'取消掌握':'标记已掌握'}">✓</button>
      </div>
    </div>`;
}

/* =========================================================
   模式二：背诵
   ========================================================= */
function renderRecall(){
  const list = pool();
  if(!list.length){
    view.innerHTML = `<div class="empty"><div class="big">🧠</div>
      <h3>没有可背诵的卡片</h3><p>换个筛选条件试试。</p></div>`;
    return;
  }
  const ids = list.map(c => c.id);
  if(state.rcOrder.length !== ids.length || !state.rcOrder.every(i => ids.includes(i))){
    const cur = state.rcOrder[state.rcIdx];
    state.rcOrder = ids;
    const i = ids.indexOf(cur);
    state.rcIdx = i >= 0 ? i : 0;
  }
  state.rcIdx = Math.max(0, Math.min(state.rcIdx, state.rcOrder.length-1));

  const c = byId(state.rcOrder[state.rcIdx]);
  if(!c){ state.rcIdx = 0; renderRecall(); return; }

  view.innerHTML = `
    <div class="stage">
      <div class="fc ${state.rcFlipped?'flipped':''}" id="fc">
        <div class="fc-in">
          <div class="fc-face fc-front">
            <div class="fc-badge">${esc(GROUPS[c.g]||c.g)} · ${String(c.id).padStart(2,'0')}</div>
            <div class="fc-en">${esc(c.en)}</div>
            ${state.showCN ? `<div class="fc-cn">${esc(c.cn)}</div>` : ''}
            <div class="fc-prompt">Say the definition in English</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-sec">
              <div class="fc-label">English Definition</div>
              <div class="fc-def">${renderHi(c.enDef)}</div>
            </div>
            ${state.showCN ? `
            <div class="fc-sec">
              <div class="fc-label">中文对照</div>
              <div class="fc-cn-def">${esc(c.cnDef)}</div>
            </div>` : ''}
            <div class="fc-sec">
              <div class="fc-label">Key Formula</div>
              <div class="fc-fml">${esc(c.fml)}</div>
            </div>
            ${state.showCN ? `
            <div class="fc-sec">
              <div class="fc-label">记忆口诀</div>
              <div class="fc-tipbox">💡 ${esc(c.tip)}</div>
            </div>` : ''}
          </div>
        </div>
      </div>

      <div class="fc-ctrl">
        <button class="btn" id="prev" ${state.rcIdx===0?'disabled':''}>← Prev</button>
        <span class="counter">${state.rcIdx+1} / ${state.rcOrder.length}</span>
        <button class="btn" id="next" ${state.rcIdx>=state.rcOrder.length-1?'disabled':''}>Next →</button>
      </div>

      <div class="fc-ctrl">
        <button class="btn ok" id="gotIt">✓ 记住了</button>
        <button class="btn warn" id="again">再练练</button>
        <button class="btn ghost speak" data-speak-btn id="speak">🔊 朗读</button>
        <button class="btn ghost" id="flip">${state.rcFlipped?'看正面':'看背面'}</button>
      </div>

      <div class="dots">
        ${state.rcOrder.map((id,i) =>
          `<i class="${state.mastered.has(id)?'done':''} ${i===state.rcIdx?'cur':''}" data-i="${i}"></i>`
        ).join('')}
      </div>
    </div>
  `;

  const fc = document.getElementById('fc');
  fc.onclick = () => { state.rcFlipped = !state.rcFlipped; fc.classList.toggle('flipped', state.rcFlipped); };

  document.getElementById('prev').onclick = e => { e.stopPropagation(); move(-1); };
  document.getElementById('next').onclick = e => { e.stopPropagation(); move(1); };
  document.getElementById('flip').onclick = e => {
    e.stopPropagation();
    state.rcFlipped = !state.rcFlipped;
    fc.classList.toggle('flipped', state.rcFlipped);
    e.target.textContent = state.rcFlipped ? '看正面' : '看背面';
  };
  document.getElementById('gotIt').onclick = e => {
    e.stopPropagation();
    if(!state.mastered.has(c.id)){ state.mastered.add(c.id); saveState(); }
    state.rcFlipped = false;
    if(state.rcIdx < state.rcOrder.length-1) state.rcIdx++;
    render();
    toast('✓ 已掌握');
  };
  document.getElementById('again').onclick = e => {
    e.stopPropagation();
    if(state.mastered.has(c.id)){ state.mastered.delete(c.id); saveState(); }
    state.rcFlipped = false;
    if(state.rcIdx < state.rcOrder.length-1) state.rcIdx++;
    render();
  };
  document.getElementById('speak').onclick = e => {
    e.stopPropagation();
    if(Speech.isSpeaking()){ Speech.cancel(); return; }
    Speech.say(plainEn(c.enDef));
  };
  view.querySelectorAll('.dots i').forEach(d => {
    d.onclick = e => {
      e.stopPropagation();
      state.rcIdx = +d.dataset.i;
      state.rcFlipped = false;
      render();
    };
  });
}
function move(d){
  const n = state.rcIdx + d;
  if(n < 0 || n >= state.rcOrder.length) return;
  state.rcIdx = n;
  state.rcFlipped = false;
  render();
}

/* =========================================================
   模式三：挖空
   ========================================================= */
function renderCloze(){
  const list = pool();
  if(!list.length){
    view.innerHTML = `<div class="empty"><div class="big">✍️</div>
      <h3>没有可挖空的概念</h3><p>换个筛选条件试试。</p></div>`;
    return;
  }
  const ids = list.map(c => c.id);
  if(state.clOrder.length !== ids.length || !state.clOrder.every(i => ids.includes(i))){
    const cur = state.clOrder[state.clIdx];
    state.clOrder = ids;
    const i = ids.indexOf(cur);
    state.clIdx = i >= 0 ? i : 0;
  }
  state.clIdx = Math.max(0, Math.min(state.clIdx, state.clOrder.length-1));

  const c = byId(state.clOrder[state.clIdx]);
  if(!c){ state.clIdx = 0; renderCloze(); return; }

  const parts = tokens(c.enDef);
  const kwTokens = [];
  parts.forEach((p, i) => { if(p.t === 'k') kwTokens.push({ idx:i, text:p.v }); });
  const prefix = c.id + '-';

  function buildBody(){
    const maskSet = selectMaskedKeywords(kwTokens, state.clozeDensity);
    let revealedCount = 0;
    const html = parts.map((p, i) => {
      if(p.t === 'x') return esc(p.v);
      const isMasked = maskSet.has(i);
      if(!isMasked){
        return `<span class="kw">${esc(p.v)}</span>`;
      }
      const on = state.clRevealed.has(prefix + i);
      if(on) revealedCount++;
      const w = Math.max(3, Math.min(p.v.length, 22));
      return `<span class="blank ${on?'on':''}" data-bi="${i}" style="min-width:${w}ch">${on?esc(p.v):'&nbsp;'}</span>`;
    }).join('');
    return { html, masked: maskSet.size, revealed: revealedCount, total: kwTokens.length };
  }

  const init = buildBody();

  view.innerHTML = `
    <div class="cloze-wrap">
      <div class="cloze-card">
        <div class="cloze-head">
          <span class="cloze-num">${String(c.id).padStart(2,'0')}</span>
          <span class="cloze-en">${esc(c.en)}</span>
        </div>
        ${state.showCN ? `<div class="cloze-cn">${esc(c.cn)}</div>` : '<div style="height:14px"></div>'}

        <div class="cloze-density">
          <span class="density-label">遮蔽度</span>
          <input type="range" class="density-range" id="clozeDensity"
                 min="0" max="100" step="10" value="${state.clozeDensity}">
          <span class="density-value" id="clozeDensityVal">${state.clozeDensity}%</span>
          <span class="density-info" id="clozeDensityInfo">${init.masked}/${init.total}</span>
        </div>

        <div class="cloze-body" id="clozeBody">${init.html}</div>

        <div class="cloze-bar">
          <button class="btn" id="hintOne">💡 提示一个</button>
          <button class="btn" id="revealAll">全部揭示</button>
          <button class="btn ghost" id="hideAll">重新遮蔽</button>
          <button class="btn ghost speak" data-speak-btn id="speakCloze">🔊 朗读</button>
          <span class="cloze-stat" id="clozeStat">${init.revealed} / ${init.masked}</span>
        </div>
      </div>

      <div class="fc-ctrl" style="margin-top:16px">
        <button class="btn" id="cPrev" ${state.clIdx===0?'disabled':''}>← Prev</button>
        <span class="counter">${state.clIdx+1} / ${state.clOrder.length}</span>
        <button class="btn primary" id="cNext" ${state.clIdx>=state.clOrder.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  `;

  const body = document.getElementById('clozeBody');
  const statEl = document.getElementById('clozeStat');
  const infoEl = document.getElementById('clozeDensityInfo');
  const slider = document.getElementById('clozeDensity');
  const sliderVal = document.getElementById('clozeDensityVal');

  function refreshBody(){
    const r = buildBody();
    body.innerHTML = r.html;
    statEl.textContent = r.revealed + ' / ' + r.masked;
    infoEl.textContent = r.masked + '/' + r.total;
  }
  function refreshStat(){
    const total = body.querySelectorAll('.blank').length;
    const revealed = body.querySelectorAll('.blank.on').length;
    statEl.textContent = revealed + ' / ' + total;
  }
  function revealBlank(b){
    const idx = +b.dataset.bi;
    state.clRevealed.add(prefix + idx);
    b.classList.add('on');
    b.textContent = parts[idx].v;
  }

  body.onclick = e => {
    const b = e.target.closest('.blank'); if(!b) return;
    if(b.classList.contains('on')) return;
    revealBlank(b);
    refreshStat();
  };

  slider.oninput = () => {
    state.clozeDensity = +slider.value;
    sliderVal.textContent = state.clozeDensity + '%';
    [...state.clRevealed].forEach(k => { if(k.startsWith(prefix)) state.clRevealed.delete(k); });
    saveState();
    refreshBody();
  };

  document.getElementById('hintOne').onclick = () => {
    const hidden = body.querySelectorAll('.blank:not(.on)');
    if(!hidden.length){ toast('已全部揭示'); return; }
    revealBlank(hidden[0]);
    refreshStat();
  };
  document.getElementById('revealAll').onclick = () => {
    body.querySelectorAll('.blank').forEach(b => revealBlank(b));
    refreshStat();
  };
  document.getElementById('hideAll').onclick = () => {
    [...state.clRevealed].forEach(k => { if(k.startsWith(prefix)) state.clRevealed.delete(k); });
    refreshBody();
  };
  document.getElementById('speakCloze').onclick = () => {
    if(Speech.isSpeaking()){ Speech.cancel(); return; }
    Speech.say(plainEn(c.enDef));
  };
  document.getElementById('cPrev').onclick = () => {
    if(state.clIdx > 0){ state.clIdx--; state.clRevealed = new Set(); renderCloze(); }
  };
  document.getElementById('cNext').onclick = () => {
    if(state.clIdx < state.clOrder.length-1){ state.clIdx++; state.clRevealed = new Set(); renderCloze(); }
  };
}

/* =========================================================
   模式四：默写
   ========================================================= */
function renderWrite(){
  const list = pool();
  if(!list.length){
    view.innerHTML = `<div class="empty"><div class="big">📝</div>
      <h3>没有可默写的概念</h3><p>换个筛选条件试试。</p></div>`;
    return;
  }
  const ids = list.map(c => c.id);
  if(state.wcOrder.length !== ids.length || !state.wcOrder.every(i => ids.includes(i))){
    const cur = state.wcOrder[state.wcIdx];
    state.wcOrder = ids;
    const i = ids.indexOf(cur);
    state.wcIdx = i >= 0 ? i : 0;
  }
  state.wcIdx = Math.max(0, Math.min(state.wcIdx, state.wcOrder.length-1));

  const c = byId(state.wcOrder[state.wcIdx]);
  if(!c){ state.wcIdx = 0; renderWrite(); return; }

  const w = state.write && state.write.qId === c.id ? state.write : null;
  const submitted = !!(w && w.submitted);

  const st = state.writeStats;
  const rate = st.keywords > 0 ? Math.round(st.hits / st.keywords * 100) : 0;

  if(!submitted){
    view.innerHTML = `
      <div class="write-wrap">
        <div class="write-top">
          <span class="chip active">默写 · ${state.wcIdx+1} / ${state.wcOrder.length}</span>
          <span class="write-score">累计命中 ${st.hits}/${st.keywords}${st.count ? ' · ' + rate + '%' : ''}</span>
        </div>

        <div class="write-qcard">
          <div class="write-term">${esc(c.en)}</div>
          ${state.showCN ? `<div class="write-cn">${esc(c.cn)}</div>` : ''}
          <div class="write-hintline">Write the full English definition from memory.</div>
        </div>

        <textarea class="write-area" id="writeArea"
          placeholder="Type your definition here...  (Ctrl / ⌘ + Enter 提交)"
          spellcheck="false" autocapitalize="off" autocomplete="off">${esc(w ? w.answer : '')}</textarea>

        <div class="write-actions">
          <button class="btn primary" id="submitBtn">提交并对照答案</button>
          <button class="btn ghost" id="skipBtn">跳过 →</button>
          <span class="write-tip">提交后会显示标准答案，并标出你命中/遗漏的关键词</span>
        </div>
      </div>
    `;

    const ta = document.getElementById('writeArea');
    setTimeout(() => ta && ta.focus(), 40);

    ta.addEventListener('input', () => {
      if(!state.write || state.write.qId !== c.id){
        state.write = { qId: c.id, answer: ta.value, submitted:false, results:null };
      } else {
        state.write.answer = ta.value;
      }
    });
    ta.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
        e.preventDefault();
        doSubmit(c, ta.value);
      }
    });

    document.getElementById('submitBtn').onclick = () => doSubmit(c, ta.value);
    document.getElementById('skipBtn').onclick = () => {
      if(state.wcIdx < state.wcOrder.length-1){ state.wcIdx++; state.write = null; renderWrite(); }
      else toast('已是最后一题');
    };
    return;
  }

  const results = w.results || [];
  const hits = results.filter(r => r.hit).length;
  const total = results.length;
  const pct = total > 0 ? Math.round(hits / total * 100) : 0;
  let badgeCls = 'score-badge';
  let msg = '';
  if(pct >= 80){ badgeCls += ' high'; msg = 'Excellent — 关键点覆盖很完整！'; }
  else if(pct >= 50){ badgeCls += ' mid'; msg = 'Good — 主要点写到了，个别术语可以再补。'; }
  else { badgeCls += ' low'; msg = '再练练 — 对照标准答案，把遗漏的点记下来。'; }

  view.innerHTML = `
    <div class="write-wrap">
      <div class="write-top">
        <span class="chip active">默写 · ${state.wcIdx+1} / ${state.wcOrder.length}</span>
        <span class="write-score">累计命中 ${st.hits}/${st.keywords}${st.count ? ' · ' + rate + '%' : ''}</span>
      </div>

      <div class="write-qcard">
        <div class="write-term">${esc(c.en)}</div>
        ${state.showCN ? `<div class="write-cn">${esc(c.cn)}</div>` : ''}
      </div>

      <div class="result-card">
        <div class="result-score">
          <span class="${badgeCls}">命中 ${hits} / ${total} 关键词 · ${pct}%</span>
          <span class="score-msg">${esc(msg)}</span>
        </div>

        <div class="result-label">Standard Definition</div>
        <div class="standard-def">${renderHi(c.enDef)}</div>

        <div class="result-label">Keyword Coverage</div>
        <div class="kw-list">
          ${results.map(r => `
            <div class="kw-item ${r.hit?'hit':'miss'}">
              <span class="kw-mark">${r.hit ? '✓' : '✕'}</span>
              <span class="kw-text">${esc(r.keyword)}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="write-actions">
        <button class="btn ok" id="gotIt">✓ 掌握了，下一题</button>
        <button class="btn warn" id="again">再来一遍</button>
        <button class="btn ghost speak" data-speak-btn id="speakStd">🔊 朗读标准答案</button>
        <span class="write-tip">${state.wcIdx < state.wcOrder.length-1 ? '' : '这是最后一题'}</span>
      </div>
    </div>
  `;

  document.getElementById('gotIt').onclick = () => {
    if(!state.mastered.has(c.id)){ state.mastered.add(c.id); saveState(); }
    const isLast = state.wcIdx >= state.wcOrder.length - 1;
    state.write = null;
    if(!isLast) state.wcIdx++;
    render();
    toast(isLast ? '✓ 已掌握 · 已是最后一题' : '✓ 已掌握');
  };
  document.getElementById('again').onclick = () => {
    state.write = null;
    renderWrite();
    setTimeout(() => {
      const ta = document.getElementById('writeArea');
      if(ta) ta.focus();
    }, 40);
  };
  document.getElementById('speakStd').onclick = () => {
    if(Speech.isSpeaking()){ Speech.cancel(); return; }
    Speech.say(plainEn(c.enDef));
  };
}

function doSubmit(c, answerText){
  const text = String(answerText || '').trim();
  if(!text){
    toast('请先写下你的定义，或点击"跳过"');
    return;
  }
  const keywords = extractKeywords(c.enDef);
  const results = checkAnswer(text, keywords);
  const hits = results.filter(r => r.hit).length;
  const total = results.length;

  state.write = { qId: c.id, answer: text, submitted: true, results };
  state.writeStats.hits += hits;
  state.writeStats.keywords += total;
  state.writeStats.count += 1;
  saveState();

  renderWrite();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPlan(){
  const day = state.planDay;
  const d = PLAN[day];
  if(!d){ state.planDay = 1; renderPlan(); return; }

  const totalItems = d.blocks.reduce((s,b) => s + b.items.length, 0);
  const doneItems = d.blocks.reduce((s,b,bi) =>
    s + b.items.filter((_,ii) => state.planDone.has(`${day}-b${bi}-${ii}`)).length, 0);
  const pct = totalItems ? Math.round(doneItems / totalItems * 100) : 0;

  const blocksHtml = d.blocks.map((b, bi) => {
    const bDone = b.items.filter((_,ii) => state.planDone.has(`${day}-b${bi}-${ii}`)).length;
    const items = b.items.map((it, ii) => {
      const id = `${day}-b${bi}-${ii}`;
      const on = state.planDone.has(id);
      return `<div class="check-item ${on?'done':''}" data-pid="${id}">
        <span class="ci-box">✓</span>
        <span class="ci-text">${it}</span>
      </div>`;
    }).join('');
    return `<div class="block-card" data-bi="${bi}">
      <div class="block-head">
        <span class="block-time">${esc(b.time)}</span>
        <span class="block-title">${esc(b.title)}</span>
        <span class="block-cnt">${bDone}/${b.items.length}</span>
      </div>
      <div class="check-list">${items}</div>
    </div>`;
  }).join('');

  const clHtml = d.checklist.map((t, i) => {
    const id = `${day}-c${i}`;
    const on = state.planDone.has(id);
    return `<div class="check-item ${on?'done':''}" data-pid="${id}">
      <span class="ci-box">✓</span>
      <span class="ci-text">${t}</span>
    </div>`;
  }).join('');

  view.innerHTML = `
    <div class="plan-wrap">
      <div class="plan-hero">
        <h2>🗓 ${esc(d.title)}</h2>
        <p>${esc(d.sub)}</p>
        <div class="plan-prog-row">
          <div class="prog-bar"><i class="plan-fill" style="width:${pct}%"></i></div>
          <span class="plan-prog-text" id="planProgText">${doneItems}/${totalItems} · ${pct}%</span>
        </div>
      </div>

      <div class="day-tabs" id="dayTabs">
        ${[1,2,3].map(n =>
          `<button data-day="${n}" class="${n===day?'active':''}">Day ${n}</button>`
        ).join('')}
      </div>

      ${blocksHtml}

      <div class="ghead"><span class="bar"></span>本日自检清单</div>
      <div class="block-card">
        <div class="check-list">${clHtml}</div>
      </div>

      <div class="plan-actions">
        <button class="btn ghost" id="planResetDay">↺ 重置本日</button>
        <button class="btn ghost" id="planResetAll">⌫ 重置全部计划</button>
      </div>
    </div>
  `;

  const dt = document.getElementById('dayTabs');
  dt.onclick = e => {
    const b = e.target.closest('[data-day]'); if(!b) return;
    state.planDay = +b.dataset.day;
    saveState();
    renderPlan();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  view.querySelectorAll('[data-pid]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.pid;
      if(state.planDone.has(id)) state.planDone.delete(id);
      else state.planDone.add(id);
      saveState();
      el.classList.toggle('done', state.planDone.has(id));
      updatePlanCounts();
    };
  });

  document.getElementById('planResetDay').onclick = () => {
    const p = day + '-';
    [...state.planDone].forEach(id => { if(id.startsWith(p)) state.planDone.delete(id); });
    saveState();
    renderPlan();
    toast('Day ' + day + ' 已重置');
  };
  document.getElementById('planResetAll').onclick = () => {
    if(!state.planDone.size){ toast('计划本来就是空的'); return; }
    state.planDone = new Set();
    saveState();
    renderPlan();
    toast('三天计划已全部重置');
  };
}

function updatePlanCounts(){
  const day = state.planDay;
  const d = PLAN[day];
  if(!d) return;

  const totalItems = d.blocks.reduce((s,b) => s + b.items.length, 0);
  const doneItems = d.blocks.reduce((s,b,bi) =>
    s + b.items.filter((_,ii) => state.planDone.has(`${day}-b${bi}-${ii}`)).length, 0);
  const pct = totalItems ? Math.round(doneItems / totalItems * 100) : 0;

  const fill = view.querySelector('.plan-fill');
  if(fill) fill.style.width = pct + '%';
  const txt = document.getElementById('planProgText');
  if(txt) txt.textContent = `${doneItems}/${totalItems} · ${pct}%`;

  view.querySelectorAll('.block-card[data-bi]').forEach(card => {
    const bi = +card.dataset.bi;
    const b = d.blocks[bi];
    if(!b) return;
    const cnt = card.querySelector('.block-cnt');
    if(!cnt) return;
    const n = b.items.filter((_,ii) => state.planDone.has(`${day}-b${bi}-${ii}`)).length;
    cnt.textContent = `${n}/${b.items.length}`;
  });
}

/* =========================================================
   模式六：PDF 阅读
   ========================================================= */
let pdfDoc = null;
let pdfDocToken = 0;
let pdfFileName = '';
let pdfNumPages = 0;
let pdfBaseWidth = 612;
let pdfBaseHeight = 792;
let pdfScale = 1;
let pdfFit = true;
let pdfLoading = false;
let pdfLibPromise = null;
let pdfObserver = null;
let pdfFileInput = null;
let pdfResizeTimer = null;
const pdfCache = new Map();
const PDF_CACHE_MAX = 20;
const PDF_CDNS = [
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/',
  'https://unpkg.com/pdfjs-dist@3.11.174/build/'
];

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => res();
    s.onerror = () => rej(new Error('script load failed: ' + src));
    document.head.appendChild(s);
  });
}

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = (async () => {
    let lastErr = null;
    for(const base of PDF_CDNS){
      try{
        await loadScript(base + 'pdf.min.js');
        if(window.pdfjsLib){
          try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; }catch(_){}
          return window.pdfjsLib;
        }
      }catch(e){ lastErr = e; }
    }
    pdfLibPromise = null;
    throw lastErr || new Error('无法加载 PDF 引擎');
  })();
  return pdfLibPromise;
}

function pdfCacheSet(key, cv){
  pdfCache.set(key, cv);
  while(pdfCache.size > PDF_CACHE_MAX){
    const k = pdfCache.keys().next().value;
    pdfCache.delete(k);
  }
}

function pickPdfFile(){
  if(!pdfFileInput){
    pdfFileInput = document.createElement('input');
    pdfFileInput.type = 'file';
    pdfFileInput.accept = 'application/pdf,.pdf';
    pdfFileInput.style.display = 'none';
    pdfFileInput.addEventListener('change', () => {
      const f = pdfFileInput.files && pdfFileInput.files[0];
      pdfFileInput.value = '';
      if(f) handlePdfFile(f);
    });
    document.body.appendChild(pdfFileInput);
  }
  pdfFileInput.click();
}

async function handlePdfFile(file){
  if(!file) return;
  const name = file.name || 'document.pdf';
  if(file.type && file.type !== 'application/pdf' && !/\.pdf$/i.test(name)){
    toast('请选择 PDF 文件');
    return;
  }
  if(pdfLoading) return;
  pdfLoading = true;
  toast('正在加载 PDF…');
  try{
    const lib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    const p1 = await doc.getPage(1);
    const vp1 = p1.getViewport({ scale: 1 });

    pdfDoc = doc;
    pdfNumPages = doc.numPages;
    pdfFileName = name;
    pdfBaseWidth = vp1.width || 612;
    pdfBaseHeight = vp1.height || 792;
    pdfDocToken++;
    pdfCache.clear();
    pdfFit = true;
    pdfScale = 1;
    view.dataset.pdfSig = '';
    view.innerHTML = '';
    render();
    toast('已加载 ' + pdfNumPages + ' 页');
  }catch(err){
    console.error(err);
    toast('PDF 加载失败：' + (err && err.message ? err.message : '未知错误'));
  }finally{
    pdfLoading = false;
  }
}

async function renderPdfPageEl(el){
  if(!pdfDoc) return;
  const n = +el.dataset.page;
  const scale = +el.dataset.scale || 1;
  const key = pdfDocToken + '|' + n + '|' + scale.toFixed(3);

  if(el.dataset.done === key) return;

  const cached = pdfCache.get(key);
  if(cached){
    el.innerHTML = '';
    el.appendChild(cached);
    el.dataset.done = key;
    el.style.minHeight = '';
    if(pdfObserver) pdfObserver.unobserve(el);
    return;
  }

  if(el.dataset.busy === '1') return;
  el.dataset.busy = '1';
  try{
    const page = await pdfDoc.getPage(n);
    const vp = page.getViewport({ scale });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.floor(vp.width * dpr));
    cv.height = Math.max(1, Math.floor(vp.height * dpr));
    cv.style.width = Math.round(vp.width) + 'px';
    cv.style.height = Math.round(vp.height) + 'px';

    const ctx = cv.getContext('2d', { alpha: false });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);

    await page.render({
      canvasContext: ctx,
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined
    }).promise;

    pdfCacheSet(key, cv);

    if(el.isConnected){
      el.innerHTML = '';
      el.appendChild(cv);
      el.dataset.done = key;
      el.style.minHeight = '';
    }
    if(pdfObserver) pdfObserver.unobserve(el);
  }catch(err){
    console.error(err);
    if(el.isConnected){
      el.innerHTML = '<div class="pdf-err">第 ' + n + ' 页渲染失败</div>';
    }
  }finally{
    delete el.dataset.busy;
  }
}

function setupPdfObserver(){
  if(pdfObserver) pdfObserver.disconnect();
  const pages = document.querySelectorAll('.pdf-page');
  if(!pages.length) return;

  if(!('IntersectionObserver' in window)){
    pages.forEach(el => renderPdfPageEl(el));
    return;
  }
  pdfObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(en.isIntersecting) renderPdfPageEl(en.target);
    });
  }, { rootMargin: '800px 0px 800px 0px', threshold: 0 });
  pages.forEach(el => pdfObserver.observe(el));
}

function pdfApplyScale(newScale, fit){
  pdfFit = !!fit;
  pdfScale = Math.max(0.15, Math.min(5, newScale));

  const pagesEl = document.getElementById('pdfPages');
  if(!pagesEl){ renderPdf(); return; }

  const phH = Math.round(pdfBaseHeight * pdfScale);
  const phW = Math.round(pdfBaseWidth * pdfScale);

  pagesEl.querySelectorAll('.pdf-page').forEach(el => {
    el.dataset.scale = String(pdfScale);
    delete el.dataset.done;
    el.dataset.busy = '';
    delete el.dataset.busy;
    el.style.minHeight = phH + 'px';
    el.innerHTML = `<div class="pdf-ph" style="width:${phW}px;height:${phH}px"></div>`;
  });

  const zv = document.getElementById('pdfZoomVal');
  if(zv) zv.textContent = Math.round(pdfScale * 100) + '%';
  const fb = document.getElementById('pdfFitBtn');
  if(fb) fb.classList.toggle('on', pdfFit);

  view.dataset.pdfSig = pdfDocToken + '|' + (pdfFit ? 'fit' : 'free') + '|' + pdfScale.toFixed(4);
  setupPdfObserver();
}

function pdfFitWidth(){
  const pagesEl = document.getElementById('pdfPages');
  const avail = Math.max(180, (pagesEl ? pagesEl.clientWidth : view.clientWidth) - 2);
  const s = Math.max(0.15, Math.min(4, avail / pdfBaseWidth));
  pdfApplyScale(s, true);
}

function renderPdf(){
  if(!pdfDoc){
    view.dataset.pdfSig = '';
    view.innerHTML = `
      <div class="pdf-wrap">
        <div class="pdf-drop" id="pdfDrop">
          <div class="pd-ic">📄</div>
          <h3>点击选择 PDF 文件</h3>
          <p>也可以把 PDF 直接拖拽到本页面 · 文件只在你本机浏览器里解析，不会上传到任何服务器</p>
          <button class="btn primary" type="button" id="pdfPickBtn">📂 选择 PDF</button>
        </div>
      </div>`;
    const drop = document.getElementById('pdfDrop');
    if(drop) drop.onclick = () => pickPdfFile();
    return;
  }

  const sig = pdfDocToken + '|' + (pdfFit ? 'fit' : 'free') + '|' + pdfScale.toFixed(4);
  if(view.dataset.pdfSig === sig && view.querySelector('.pdf-pages')) return;

  const phH = Math.round(pdfBaseHeight * pdfScale);
  const phW = Math.round(pdfBaseWidth * pdfScale);
  const pages = [];
  for(let i = 1; i <= pdfNumPages; i++){
    pages.push(`<div class="pdf-page" data-page="${i}" data-scale="${pdfScale}">
      <div class="pdf-ph" style="width:${phW}px;height:${phH}px"></div>
    </div>`);
  }

  view.innerHTML = `
    <div class="pdf-wrap">
      <div class="pdf-bar">
        <span class="pdf-badge">PDF</span>
        <span class="pdf-fname" title="${esc(pdfFileName)}">${esc(pdfFileName)}</span>
        <span class="pdf-meta">${pdfNumPages} 页</span>
        <span class="spacer"></span>
        <button class="tbtn ${pdfFit?'on':''}" id="pdfFitBtn" title="适应宽度">适应宽度</button>
        <button class="icon-btn" id="pdfZoomOut" title="缩小">−</button>
        <span class="pdf-zoom-val" id="pdfZoomVal">${Math.round(pdfScale*100)}%</span>
        <button class="icon-btn" id="pdfZoomIn" title="放大">+</button>
        <button class="tbtn" id="pdfChange" title="选择另一个 PDF">换文件</button>
      </div>
      <div class="pdf-pages" id="pdfPages">${pages.join('')}</div>
    </div>
  `;

  const fitBtn = document.getElementById('pdfFitBtn');
  if(fitBtn) fitBtn.onclick = () => pdfFitWidth();

  const zo = document.getElementById('pdfZoomOut');
  if(zo) zo.onclick = () => pdfApplyScale(pdfScale / 1.2, false);

  const zi = document.getElementById('pdfZoomIn');
  if(zi) zi.onclick = () => pdfApplyScale(pdfScale * 1.2, false);

  const ch = document.getElementById('pdfChange');
  if(ch) ch.onclick = () => pickPdfFile();

  // 首屏按需适配 / 应用比例
  if(pdfFit) pdfFitWidth();
  else pdfApplyScale(pdfScale, false);
}

/* 拖拽 PDF 到页面 */
(function bindPdfDrop(){
  const onDragOver = e => {
    if(state.mode !== 'pdf') return;
    e.preventDefault();
    const d = document.getElementById('pdfDrop');
    if(d) d.classList.add('drag');
  };
  document.addEventListener('dragover', onDragOver);
  document.addEventListener('dragenter', onDragOver);
  document.addEventListener('dragleave', e => {
    const d = document.getElementById('pdfDrop');
    if(d) d.classList.remove('drag');
  });
  document.addEventListener('drop', e => {
    if(state.mode !== 'pdf') return;
    e.preventDefault();
    const d = document.getElementById('pdfDrop');
    if(d) d.classList.remove('drag');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handlePdfFile(f);
  });
})();

/* 窗口尺寸变化时，若处于「适应宽度」则重新计算 */
window.addEventListener('resize', () => {

  clearTimeout(pdfResizeTimer);
  pdfResizeTimer = setTimeout(() => {
    if(state.mode === 'pdf' && pdfDoc && pdfFit) pdfFitWidth();

});

          <select class="edit-select" id="e-g">
            ${Object.keys(GROUPS).map(g =>
              `<option value="${g}"${g===c.g?' selected':''}>${g} · ${esc(GROUPS[g])}</option>`
            ).join('')}
          </select>
        </div>
      </div>

      <div class="msec">
        <div class="edit-field">
          <div class="edit-label">英文定义 <span class="tag">enDef</span></div>
          <textarea class="edit-area" id="e-enDef" rows="5">${esc(c.enDef)}</textarea>
          <div class="edit-hint">用 <code>**双星号**</code> 包住关键词，会被高亮、挖空、默写评分共用。</div>
        </div>
      </div>

      <div class="msec">
        <div class="edit-field">
          <div class="edit-label">中文解释 <span class="tag">cnDef</span></div>
          <textarea class="edit-area" id="e-cnDef" rows="3">${esc(c.cnDef)}</textarea>
        </div>
      </div>

      <div class="msec">
        <div class="edit-field">
          <div class="edit-label">记忆口诀 <span class="tag">tip</span></div>
          <textarea class="edit-area" id="e-tip" rows="2">${esc(c.tip)}</textarea>
        </div>
      </div>

      <div class="msec">
        <div class="edit-field">
          <div class="edit-label">公式 <span class="tag">fml</span></div>
          <textarea class="edit-area mono" id="e-fml" rows="2">${esc(c.fml)}</textarea>
        </div>
      </div>

      <div class="macts">
        <button class="btn primary" id="eSave">💾 保存</button>
        <button class="btn" id="eReset" ${edited?'':'disabled'}>↺ 恢复默认</button>
        <button class="btn ghost" id="eCancel">取消</button>
      </div>
    </div>
  `;
  if(!overlay.classList.contains('open')){
    lockScroll();
    requestAnimationFrame(() => overlay.classList.add('open'));
  }

  _editorDirty = false;
  ['e-en','e-cn','e-enDef','e-cnDef','e-tip','e-fml'].forEach(fid => {
    const el = document.getElementById(fid);
    if(el) el.addEventListener('input', () => { _editorDirty = true; });
  });
  document.getElementById('e-g').addEventListener('change', () => { _editorDirty = true; });

  document.getElementById('mc').onclick = closeModal;
  document.getElementById('eCancel').onclick = closeModal;

  document.getElementById('eSave').onclick = () => {
    const v = fid => (document.getElementById(fid).value || '').trim();
    const patch = {
      en:    v('e-en')    || c.en,
      cn:    v('e-cn')    || c.cn,
      g:     document.getElementById('e-g').value,
      enDef: v('e-enDef') || c.enDef,
      cnDef: v('e-cnDef'),
      tip:   v('e-tip'),
      fml:   v('e-fml')
    };
    updateConcept(id, patch);
    _editorDirty = false;
    render();
    openModal(id);
    toast('✓ 已保存并同步到所有模式');
  };

  document.getElementById('eReset').onclick = () => {
    if(!isEdited(id)) return;
    resetConcept(id);
    _editorDirty = false;
    render();
    openEditor(id);
    toast('已恢复为默认内容');
  };
}

function closeModal(){
  if(_editorDirty && !confirm('有未保存的修改，确定放弃吗？')) return;
  _editorDirty = false;
  overlay.classList.remove('open');
  overlay.innerHTML = '';
  unlockScroll();
}
overlay.addEventListener('click', e => {
  if(e.target === overlay) closeModal();
});

/* =========================================================
   快捷键
   ========================================================= */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  const t = e.target;
  // 焦点在表单控件或按钮上时，交给元素自身处理，避免双重触发
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
           t.tagName === 'SELECT' || t.tagName === 'BUTTON')) return;

  if(state.mode === 'recall'){
    if(e.key === 'ArrowLeft'){ e.preventDefault(); move(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); move(1); }
    else if(e.key === ' '){
      e.preventDefault();
      const fc = document.getElementById('fc');
      if(fc) fc.click();
    }
    else if(e.key === 'Enter'){
      e.preventDefault();
      const b = document.getElementById('gotIt');
      if(b) b.click();
    }
  }
  if(state.mode === 'cloze'){
    if(e.key === ' '){
      e.preventDefault();
      const b = document.getElementById('hintOne');
      if(b) b.click();
    }
    else if(e.key === 'ArrowLeft'){
      const b = document.getElementById('cPrev');
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
    }
    else if(e.key === 'ArrowRight'){
      const b = document.getElementById('cNext');
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
    }
  }
});

/* =========================================================
   启动
   ========================================================= */
document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('[data-mode]');
  if(!b) return;
  Speech.cancel();
  if(b.dataset.mode !== state.mode){
    resetSessionOrders();
  }
  state.mode = b.dataset.mode;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
document.getElementById('themeBtn').onclick = cycleTheme;
document.getElementById('cnToggle').onclick = function(){
  state.showCN = !state.showCN;
  this.classList.toggle('on', state.showCN);
  this.textContent = state.showCN ? '中' : 'EN';
  saveState();
  render();
};

(function init(){
  loadState();
  loadOverrides();   // 必须先于任何 render，重建 CONCEPTS
  applyTheme();
  const ct = document.getElementById('cnToggle');
  ct.classList.toggle('on', state.showCN);
  ct.textContent = state.showCN ? '中' : 'EN';
  refreshVoiceUI();
  render();
})();
</script>
</body>
</html>
